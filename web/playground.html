<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Playground - Monarch</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/img/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/shell.css" />
  <link rel="stylesheet" href="/css/hub.css" />
</head>

<body class="h-page dark-mode">
  <header class="h-top">
    <div class="h-brand">
      <a href="/hub.html#workflows">Agent Hub</a>
      <span class="h-title">Workflow Playground</span>
    </div>
    <span class="h-spacer"></span>
  </header>

  <section class="pg" id="pg">
    <aside class="pg-side">
      <input class="h-input" id="pg-search" type="search" placeholder="Search workflows" aria-label="Search workflows">
      <div class="pg-list" id="pg-list" aria-label="Workflows"></div>
    </aside>
    <div class="pg-main">
      <header class="pg-head" id="pg-head"></header>
      <div class="pg-thread" id="pg-thread" aria-live="polite"></div>
      <div class="pg-fields" id="pg-fields" hidden></div>
      <form class="pg-composer" id="pg-composer">
        <button type="button" class="h-btn h-btn-ghost h-btn-sm" id="pg-fields-toggle" hidden></button>
        <textarea id="pg-input" class="pg-input" rows="1" placeholder="Pick a workflow to start" disabled aria-label="Message"></textarea>
        <button type="submit" class="h-btn" id="pg-send" disabled>Send</button>
      </form>
    </div>
    <aside class="pg-about" id="pg-about" aria-label="About this workflow"></aside>
  </section>

  <script src="/js/shell.js"></script>
  <script src="/js/hub-common.js"></script>
  <script src="/js/playground.js"></script>
</body>

</html>
