<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Studio - Monarch</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/img/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/shell.css" />
  <link rel="stylesheet" href="/css/hub.css" />
</head>

<body class="h-page dark-mode">
  <header class="h-top">
    <div class="h-brand">
      <a href="/hub.html">Agent Hub</a>
      <span class="h-title" id="s-title">Agent Studio</span>
    </div>
    <ol class="s-steps" id="s-steps" hidden></ol>
    <span class="h-pill" id="s-version" hidden></span>
    <span class="s-dirty" id="s-dirty" hidden>Unsaved changes</span>
    <span class="h-spacer"></span>
    <div class="h-row" id="s-save-bar" hidden>
      <input class="h-input" id="s-message" placeholder="Version note (optional)" style="width: 220px">
      <button class="h-btn" id="s-save">Save</button>
    </div>
  </header>

  <div id="view-start" class="s-start h-hidden"></div>

  <div id="view-builder" class="s-builder h-hidden"></div>

  <div id="view-editor" class="s-editor h-hidden">
    <nav class="s-nav" id="s-nav" aria-label="Sections"></nav>
    <main class="s-form" id="s-form"></main>
    <aside class="s-side">
      <nav class="h-tabs" id="s-side-tabs"></nav>
      <div class="s-side-body" id="s-side-body"></div>
    </aside>
  </div>

  <script src="/js/shell.js"></script>
  <script src="/js/hub-common.js"></script>
  <script src="/js/studio.js"></script>
</body>

</html>
